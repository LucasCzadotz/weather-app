<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>App Clima</title>
</head>

<body>
    <header>
        <h1>CLIMALUCAS</h1>
        <img src="imgs/weather.png" alt="Logo clima nublado">
    </header>
    <main>
        <form class="busca">
            <input type="text" aria-label="Cidade" placeholder="Informe a cidade" required>
            <button id="btnBuscar" type="submit">Buscar!</button>
        </form>
        <p class="mensagem" role="status"></p>
        <section class="cardClima" hidden>
            <div class="topo">
                <h2 id="cidade"></h2>
                <p id="local"></p>
                <time id="dataHora"></time>
            </div>
            <div class="principal">
                <img id="iconeResultado" alt="">
                <span id="temperatura"></span>
                <p id="condicao"></p>
            </div>
            <div class="detalhes">
                <p>Sensação: <span id="sensacao"></span></p>
                <p>Umidade: <span id="umidade"></span></p>
                <p>Vento: <span id="vento"></span></p>
            </div>
        </section>
    </main>
    <footer>
        Dev Lucas Diego Czadotz · @lucasczadotz
    </footer>

    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
